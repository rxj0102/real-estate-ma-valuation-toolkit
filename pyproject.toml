[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-ma-toolkit"
version = "0.1.0"
description = "Real estate M&A valuation toolkit: property-level modeling, DCF, comps, precedent transactions, football field, and buyer screening for a sell-side advisory engagement."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
